<div class="login-container">
    <div class="login-box">
      <h2 class="login-title">Login</h2>
      <p class="login-subtitle">Please enter your credentials</p>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter your email">
          <!-- <div *ngIf="submitted && f.[email].errors" class="error-message">
            <small *ngIf="f.email.errors.required">Email is required.</small>
            <small *ngIf="f.email.errors.email">Enter a valid email.</small>
          </div> -->
        </div>
  
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter your password">
          <!-- <div *ngIf="submitted && f.password.errors" class="error-message">
            <small *ngIf="f.password.errors.required">Password is required.</small>
            <small *ngIf="f.password.errors.minlength">Password must be at least 6 characters.</small>
          </div> -->
        </div>
  
        <button type="submit" class="btn btn-primary login-btn">Login</button>
  
        <div class="text-center mt-3">
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        
        <div class="text-center mt-3">
          <span>Don't have an account? <a href="#">Sign Up</a></span>
        </div>
      </form>
    </div>
  </div>
